  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), body = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
                                             'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, body);
  return new TextDecoder().decode(plain);
}

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err'), btn = document.getElementById('go');
  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'This page must be opened over HTTPS.';
    return;
  }
  btn.disabled = true; err.textContent = 'Unlocking...';
  let html;
  try {
    html = await decrypt(document.getElementById('pw').value);
  } catch (e) {
    err.textContent = 'Incorrect password.';
    btn.disabled = false;
    return;
  }
  document.open(); document.write(html); document.close();
});
